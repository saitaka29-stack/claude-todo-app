<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ToDo</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header>
      <h1>ToDo</h1>
      <p class="count" id="count"></p>
    </header>

    <form id="new-form" autocomplete="off">
      <input id="new-input" type="text" placeholder="やることを入力して Enter" maxlength="200" required>
      <button type="submit">追加</button>
    </form>

    <nav class="filters" aria-label="表示切り替え">
      <button type="button" data-filter="all" class="active">すべて</button>
      <button type="button" data-filter="active">未完了</button>
      <button type="button" data-filter="done">完了</button>
    </nav>

    <ul id="list" class="list"></ul>
    <p id="empty" class="empty">タスクはありません</p>

    <footer>
      <button type="button" id="clear-done">完了済みを削除</button>
    </footer>
  </main>
  <script src="app.js"></script>
</body>
</html>
