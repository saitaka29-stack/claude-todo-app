<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ToDo</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header>
      <h1>ToDo</h1>
      <p class="count" id="count"></p>
    </header>

    <div class="progress" aria-label="達成率">
      <div class="progress-bar"><div id="progress-fill" class="progress-fill"></div></div>
      <span id="progress-text" class="progress-text"></span>
    </div>

    <form id="new-form" autocomplete="off">
      <input id="new-input" type="text" placeholder="やることを入力して Enter" maxlength="200" required>
      <input id="new-due" type="date" aria-label="期限（任意）" title="期限（任意）">
      <button type="submit">追加</button>
    </form>

    <nav class="filters" aria-label="表示切り替え">
      <button type="button" data-filter="all" class="active">すべて</button>
      <button type="button" data-filter="active">未完了</button>
      <button type="button" data-filter="done">完了</button>
    </nav>

    <ul id="list" class="list"></ul>
    <p id="empty" class="empty">タスクはありません</p>

    <footer>
      <button type="button" id="clear-done">完了済みを削除</button>
    </footer>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden>
    <span>タスクを削除しました</span>
    <button type="button" id="undo">元に戻す</button>
  </div>
  <script src="app.js"></script>
</body>
</html>
